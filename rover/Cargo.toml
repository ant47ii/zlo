[package]
name = "rover"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rover"
path = "src/main.rs"
test = false
bench = false

[dependencies]
radio = { path = "../radio" }

cortex-m = { version = "0.7.9", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.6"
 
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32g431c8", "low-power", "time-driver-any", "exti"] }
embassy-embedded-hal = { version = "0.6.0" }
embedded-hal = {version = "1.0.0"}
embedded-hal-bus = { version = "0.3,0", features = ["async"] }
embedded-hal-async = { version = "1.0.0"}

embassy-sync = { version = "0.8.0", features = ["defmt"] } #Channel

defmt = "1.1.1"
defmt-rtt = "1.3.0"


heapless = { version = "0.9.3"}
panic-halt = "1.0.0"

#embedded-nrf24l01-async = { version = "0.3.1" }

[profile.dev]
opt-level = "s"       # Оптимизация по размеру ("s" = size)
lto = true            # Link-Time Optimization (удаляет неиспользуемый код из внешних библиотек)
codegen-units = 1     # Улучшает оптимизацию за счет сборки в один поток
panic = "abort"       # Отключает раскрутку стека при панике (экономит тонну памяти)
